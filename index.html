<script src="https://cdn.tailwindcss.com"></script>

  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'] },
    colors: { night: '#0A0E1F', surface: '#111833', card: '#161D3B', lav: '#8B7FE0', moon: '#EDEBF5', haze: '#9C99AE' }
  } } };
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<style>
:root{--bg:#0A0E1F;--bg2:#111833;--card:#161D3B;--line:rgba(255,255,255,.06);--accent:#8B7FE0;--accent2:#A89EF0;--title:#EDEBF5;--body:#9C99AE;--mute:#6F6D88;--ok:#7BD8B4;--warn:#E8B77A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--body);font-family:Inter,-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible,[role=slider]:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
input{font-family:inherit;color-scheme:dark}
::selection{background:rgba(139,127,224,.4)}
#root{position:fixed;inset:0}
.boot{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,rgba(139,127,224,.18),transparent 55%),#0A0E1F}

/* ---------- stage / frame ---------- */
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse 70% 55% at 50% 38%,#181b40 0%,#0d1129 55%,#0A0E1F 100%)}
.stage .glow{position:absolute;left:50%;top:46%;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;background:radial-gradient(circle,rgba(139,127,224,.16),transparent 62%);pointer-events:none}
.stars{position:absolute;left:0;top:0;width:2px;height:2px;border-radius:50%;background:transparent;pointer-events:none}
.stage-cap{margin-top:16px;font-size:13px;color:var(--mute);letter-spacing:.02em;position:relative}
.phone-box{position:relative;flex:none}
.phone-scale{position:absolute;left:0;top:0;transform-origin:top left}
.bezel{position:relative;width:414px;height:868px;padding:12px;border-radius:64px;background:linear-gradient(145deg,#2a2e45,#0b0d18 40%,#1c2036);box-shadow:0 0 0 1.5px #3a3f5e,0 0 0 3px #07080f,0 40px 90px -20px rgba(0,0,0,.8),0 0 120px -30px rgba(139,127,224,.35)}
.bezel .btn-side{position:absolute;width:4px;border-radius:3px;background:#2a2e45}
.island{position:absolute;top:11px;left:50%;width:118px;height:34px;margin-left:-59px;border-radius:20px;background:#000;z-index:300;pointer-events:none}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:290;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 40px;font-size:15px;font-weight:600;color:var(--title);pointer-events:none}
.statusbar .sb-r{display:flex;gap:6px;align-items:center}
.home-ind{position:absolute;bottom:7px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(237,235,245,.55);z-index:290;pointer-events:none}

/* ---------- app shell ---------- */
.app{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--tab:62px;isolation:isolate}
.app.framed{width:390px;height:844px;border-radius:52px;--sat:54px;--sab:22px}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 14px) 20px calc(var(--tab) + var(--sab) + 30px);scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen-enter{animation:screenIn .42s cubic-bezier(.2,.8,.2,1) both}
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.2);opacity:0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes dots{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:40;display:flex;padding:6px 6px var(--sab);height:calc(var(--tab) + var(--sab));background:rgba(10,14,31,.72);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;font-size:10.5px;font-weight:600;letter-spacing:.01em;color:#6F6D88;transition:color .25s,transform .15s}
.tab:active{transform:scale(.92)}
.tab svg{transition:transform .35s cubic-bezier(.3,1.6,.5,1),filter .3s}
.tab.active{color:var(--accent2)}
.tab.active svg{transform:translateY(-1px) scale(1.08);filter:drop-shadow(0 0 8px rgba(139,127,224,.7))}

/* ---------- type ---------- */
.h1{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.08;color:var(--title)}
.h2{font-size:19px;font-weight:700;letter-spacing:-.02em;color:var(--title);line-height:1.2}
.h3{font-size:15.5px;font-weight:600;color:var(--title);letter-spacing:-.01em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.body{font-size:14.5px;line-height:1.58;color:var(--body)}
.small{font-size:12.5px;line-height:1.5;color:var(--body)}
.mute{font-size:12px;line-height:1.5;color:var(--mute)}
.title-c{color:var(--title)}
.num{font-variant-numeric:tabular-nums}
.logo{display:inline-flex;align-items:center;font-weight:800;letter-spacing:-.045em;color:#fff;line-height:1}
.logo svg{margin-left:.08em;width:.62em;height:.62em;flex:none}

/* ---------- cards ---------- */
.stack{display:flex;flex-direction:column;gap:14px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.card.pad-sm{padding:14px}
.card-ai{position:relative;isolation:isolate;background:linear-gradient(180deg,rgba(139,127,224,.09),rgba(22,29,59,0) 55%),var(--card);border:1px solid transparent;border-radius:22px;padding:18px;box-shadow:0 20px 50px -30px rgba(139,127,224,.55)}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
.card-ai::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--ang),rgba(139,127,224,.08),rgba(168,158,240,.95) 18%,rgba(110,150,255,.55) 34%,rgba(139,127,224,.08) 52%,rgba(139,127,224,.08));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;animation:ang 7s linear infinite;pointer-events:none;z-index:-1}
@keyframes ang{to{--ang:360deg}}
.hl{animation:hl 1.4s ease-in-out 3}
@keyframes hl{0%,100%{box-shadow:0 20px 50px -30px rgba(139,127,224,.55)}50%{box-shadow:0 0 0 3px rgba(168,158,240,.45),0 0 40px rgba(139,127,224,.55)}}
.ai-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px 3px 6px;border-radius:99px;background:rgba(139,127,224,.16);color:#BDB4FA;font-size:10.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;border:1px solid rgba(139,127,224,.25)}
.ai-badge svg{animation:pulse 2.6s ease-in-out infinite}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.gap2{gap:8px}.gap3{gap:12px}.gap4{gap:16px}
.hr{height:1px;background:var(--line);margin:14px 0}
.ico{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(139,127,224,.14);color:var(--accent2);flex:none}
.ico.sm{width:34px;height:34px;border-radius:12px}
.ico.mute{background:rgba(255,255,255,.06);color:var(--body)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:600;background:rgba(123,216,180,.12);color:var(--ok)}
.pill.lav{background:rgba(139,127,224,.16);color:#BDB4FA}
.pill.warn{background:rgba(232,183,122,.14);color:var(--warn)}
.pill.grey{background:rgba(255,255,255,.07);color:var(--body)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);flex:none}

/* ---------- buttons ---------- */
.btn{min-height:46px;padding:0 20px;border-radius:16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s ease,box-shadow .25s,background .25s,opacity .2s,border-color .25s;white-space:nowrap;text-align:center;color:var(--title)}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:default}
.btn-primary{background:linear-gradient(180deg,#9A8FEA,#8B7FE0);color:#fff;box-shadow:0 12px 28px -10px rgba(139,127,224,.7),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-lg{min-height:58px;border-radius:20px;font-size:17px;font-weight:600}
.btn-soft{background:rgba(139,127,224,.15);color:#CFC8FF}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--title)}
.btn-danger{background:rgba(255,120,140,.12);color:#FF9BAA}
.btn-block{width:100%}
.btn-sm{min-height:44px;padding:0 16px;font-size:14px;border-radius:14px}
.linkbtn{min-height:44px;display:inline-flex;align-items:center;gap:4px;color:var(--accent2);font-weight:600;font-size:14px}
.press{transition:transform .15s ease,background .2s}
.press:active{transform:scale(.97)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--title);transition:transform .15s,background .2s;flex:none}
.iconbtn:active{transform:scale(.92)}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#A89EF0,#6B5FC9);color:#fff;font-weight:700;font-size:16px;box-shadow:0 8px 20px -8px rgba(139,127,224,.8);transition:transform .15s;flex:none}
.avatar:active{transform:scale(.92)}
.chip{min-height:44px;padding:0 16px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--title);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,background .2s,border-color .2s,color .2s;white-space:nowrap}
.chip:active{transform:scale(.96)}
.chip.sel{background:rgba(139,127,224,.2);border-color:rgba(168,158,240,.7);color:#fff}
.chip-ai{border-color:rgba(139,127,224,.35);background:rgba(139,127,224,.1);color:#D6D0FF}
.seg{display:flex;background:rgba(255,255,255,.05);border-radius:14px;padding:3px;gap:2px}
.seg button{flex:1;min-height:40px;padding:0 12px;border-radius:11px;font-size:13px;font-weight:600;color:var(--body);transition:background .25s,color .25s;text-align:center}
.seg button.on{background:rgba(139,127,224,.9);color:#fff;box-shadow:0 6px 16px -6px rgba(139,127,224,.8)}
.toggle{position:relative;width:51px;height:31px;border-radius:99px;background:rgba(255,255,255,.12);transition:background .25s;flex:none}
.toggle::before{content:'';position:absolute;inset:-7px -3px}
.toggle i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .28s cubic-bezier(.3,1.4,.5,1)}
.toggle.on{background:var(--accent);box-shadow:0 0 16px -2px rgba(139,127,224,.6)}
.toggle.on i{transform:translateX(20px)}
.toggle:disabled{opacity:.55;cursor:default}
.toggle:active i{width:31px}
.toggle.on:active i{transform:translateX(16px)}
.setrow{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0}
.setrow+.setrow{border-top:1px solid var(--line)}
.setrow .grow{flex:1;min-width:0}
.field{width:100%;min-height:48px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:0 14px;color:var(--title);font-size:16px;font-weight:500}
.timeinp{min-height:44px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);padding:0 10px;color:var(--title);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--accent) var(--p,50%),rgba(255,255,255,.1) var(--p,50%))}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:rgba(255,255,255,.1)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-11px;box-shadow:0 4px 12px rgba(0,0,0,.4),0 0 0 4px rgba(139,127,224,.35)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.4)}
input[type=range]:disabled{opacity:.45}

/* ---------- AI text ---------- */
.shimmer-lines i{display:block;height:11px;border-radius:6px;margin:9px 0;background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(139,127,224,.32) 50%,rgba(255,255,255,.05) 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}

/* ------------------------- noise taxonomy ------------------------- */
const CATS = {
  traffic: { name: 'Traffic / buses', icon: 'bus', band: 'Low frequency (60–250 Hz)', phrase: 'passing bus' },
  bass: { name: 'Bar music bass', icon: 'music', band: 'Low frequency (40–120 Hz)', phrase: 'bass-heavy music' },
  voices: { name: 'Voices / shouting', icon: 'voices', band: 'Mid frequency (300–3,000 Hz)', phrase: 'burst of voices' },

function carve(segs, s, e, st) {

    const d = g.e - g.s;

function makeEvents(r, spec, total, o) {

    voices: () => (o.weekend ? 95 + r() * 125 : 60 + r() * (total - 130)),
    truck: () => total - 130 + r() * 100

    const n = spec[cat] || 0;
    if (!n) return;
    const times = cat === 'voices' && o.voiceTimes ? o.voiceTimes.slice() : Array.from({ length: n }, place[cat]);

const HERO_SEGS = [[0, 14, 0], [14, 40, 2], [40, 100, 3], [100, 112, 2], [112, 130, 1], [130, 142, 2], [142, 164, 3], [164, 170, 0], [170, 190, 2], [190, 215, 1], [215, 245, 2], [245, 261, 3], [261, 276, 2], [276, 306, 1], [306, 330, 2], [330, 332, 0], [332, 350, 2], [350, 380, 1], [380, 382, 0], [382, 420, 2], [420, 422, 0], [422, 458, 2]];

function nightSummary(n, prev) {

  const w = n.events.find((e) => e.woke);
  const wake = w ? ` A ${CATS[w.cat].phrase} at ${fmtShort(n.bed + w.t)} woke you briefly. You got back to sleep in ${w.wakeDur} minutes.` : ` No awakenings: Shhh cancelled ${plural(n.events.filter((e) => e.pct >= 80).length, 'noise')} without waking you.`;

  const rem = Math.abs(diff) < 3 ? ' Your REM sleep was in line with your average.' : ` Your REM sleep was ${Math.abs(diff)}% ${diff > 0 ? 'above' : 'below'} your average.`;

function aggregate(list) {

  return Object.values(out).filter((o) => o.count).map((o) => ({ ...o, pct: Math.round(o.sum / o.count) })).sort((a, b) => b.count - a.count);
}

function coachReply(text, c) {
  const t = text.toLowerCase();
  const has = (...k) => k.some((w) => t.includes(w));
  const last = c.last, w = last.events.find((e) => e.woke);
  if (has('weekend', 'friday', 'saturday')) {
    return { text: `Done. I switched your earplugs to the AI Weekend profile. It keeps low-frequency cancellation at maximum for bar bass and boosts mid-frequency reduction between 1 and 3 a.m., when voices peak on your Friday and Saturday nights (${c.voiceWeekend} voice events over ${c.nights} nights). It's already synced to your earplugs.`, chip: 'Weekend profile applied ✓', apply: 'weekend' };
  }
  if (has('wake', 'woke', 'awake', 'awaken', 'wake up')) {
    if (w) return { text: `Last night you woke once, at ${fmtShort(last.bed + w.t)}. I linked it to ${CATS[w.cat].phrase} at ${w.db} dB. Only ${w.pct}% of it was reduced, because voices sit in the mid frequencies, which are harder to cancel than low ones. You were back asleep in ${w.wakeDur} minutes. I can boost mid-frequency reduction between 1 and 3 a.m. if you'd like.`, actions: [{ label: 'Open recommendation', do: 'rec' }] };
    return { text: `Good news: you didn't wake up once last night. Shhh cancelled ${plural(last.events.filter((e) => e.pct >= 80).length, 'noise')} while you slept, and your sleep score was ${last.score}. Over ${c.nights} nights, voices between 1 and 3 a.m. remain the most likely thing to wake you.` };
  }
  if (has('deep')) {
    return { text: `Last night you got ${fmtDur(last.deep)} of deep sleep, versus ${fmtDur(c.avgDeep)} on average. Deep sleep happens mostly in the first half of the night, so that's the window to protect. Three things that help: keep your bedroom around 18°C, avoid alcohol and heavy meals 3 hours before bed, and keep a regular bedtime within 30 minutes. I keep low-frequency cancellation at maximum early in the night.` };
  }
  if (has('snor')) {
    return { text: `Snoring sits around 100–1,000 Hz, partly in the mid range where cancellation is harder. The Snoring partner profile boosts mid-frequency reduction to 90% while keeping bass handled. ${c.sources.includes('Partner snoring') ? 'You told me snoring is one of your noise sources, so ' : ''}I'd start there, and I'll learn from the next nights.`, actions: [{ label: 'Switch to Snoring partner', do: 'profile:snoring' }] };
  }
  if (has('noise', 'noisy', 'bother', 'disturb', 'loud', 'sound')) {
    const top = c.top[0], voices = c.top.find((o) => o.cat === 'voices');
    return { text: `By count, ${CATS[top.cat].name.toLowerCase()} is your most frequent noise (${top.count} events over ${c.nights} nights) but ${top.pct}% of it is cancelled, so you barely hear it. The one that actually costs you sleep is voices${voices ? ` (${voices.count} events, only ${voices.pct}% reduced)` : ''}, mostly between 1 and 3 a.m. on Fridays and Saturdays.`, actions: [{ label: 'Open noise analysis', do: 'noise' }, { label: 'Let AI optimize my earplugs', do: 'rec' }] };
  }
  if (has('alarm', 'wake-up', 'morning')) {
    return { text: `Your smart alarm window is ${c.alarm.from} to ${c.alarm.to}${c.alarm.on ? '' : ' (currently off)'}. Shhh AI watches in-ear motion and heart rate, then wakes you gently in the lightest sleep stage it finds inside that window. Last night that was ${fmtClock(last.bed + last.total)}, and you woke in light sleep. A wider window of 30 minutes usually gives smoother mornings.` };
  }
  if (has('tired', 'sleepy', 'energy', 'exhaust', 'fatigue', 'fall asleep', 'faster')) {
    const diff = c.goal * 60 - c.avg7;
    return { text: `Your 7-night average is ${fmtDur(c.avg7)}, ${diff > 20 ? `${fmtDur(diff)} short of your ${c.goal} h goal` : 'close to your ' + c.goal + ' h goal'}. You usually fall asleep in about ${Math.round(c.avgLat)} minutes. To feel more rested: get daylight within an hour of waking, stop caffeine 8 hours before bed, and try a 10-minute wind-down with dim lights. Shhh handles the noise, so you only need to handle the routine.` };
  }

const AppCtx = createContext(null);
const useApp = () => useContext(AppCtx);
const revealed = new Set();

function Provider({ children }) {
  const [s, setS] = useState(() => { const v = mergeState(lsGet(LS_KEY, null)); v.chat.forEach((m) => revealed.add(m.id)); return v; });
  const [ui, setUiState] = useState({ tab: 'tonight', profile: false, sheet: null, sheetProps: null, session: null, phase: null, highlight: false, nightIdx: null });
  const [toastMsg, setToast] = useState(null);
  useEffect(() => { const t = setTimeout(() => lsSet(LS_KEY, s), 200); return () => clearTimeout(t); }, [s]);
  useEffect(() => { if (!toastMsg) return undefined; const t = setTimeout(() => setToast(null), 2700); return () => clearTimeout(t); }, [toastMsg]);

  const set = useCallback((p) => setS((prev) => ({ ...prev, ...(typeof p === 'function' ? p(prev) : p) })), []);
  const setUi = useCallback((p) => setUiState((prev) => ({ ...prev, ...p })), []);
  const toast = useCallback((msg, icon) => setToast({ msg, icon: icon || 'check', k: Date.now() }), []);
  const go = useCallback((tab, o) => setUiState((prev) => ({ ...prev, tab, profile: false, sheet: null, highlight: !!(o && o.highlight), nightIdx: tab === 'sleep' && o && o.nightIdx != null ? o.nightIdx : prev.nightIdx })), []);
  const openSheet = useCallback((id, props) => setUiState((prev) => ({ ...prev, sheet: id, sheetProps: props || null })), []);
  const closeSheet = useCallback(() => setUiState((prev) => ({ ...prev, sheet: null })), []);

  const nights = useMemo(() => [...HISTORY, ...s.sessions], [s.sessions]);
  const applyProfile = useCallback((id) => {
    const p = PROFILES.find((x) => x.id === id) || PROFILES[0];
    set((prev) => ({ profile: id, eq: id === 'custom' ? { ...prev.customEq } : { ...p.eq }, intensity: id === 'custom' ? prev.intensity : p.intensity }));
  }, [set]);
  const setEqManual = useCallback((part) => set((prev) => { const eq = { ...prev.eq, ...part }; return { eq, customEq: eq, profile: 'custom' }; }), [set]);
  const applyRec = useCallback(() => set((prev) => ({ eq: { ...prev.eq, mid: Math.max(prev.eq.mid, 84) }, sched: { on: true, from: '01:00', to: '03:00' }, recApplied: true, recDismissed: false })), [set]);

  const endSession = useCallback(() => {
    const now = new Date();
    const n = buildNight({ id: 's' + now.getTime(), date: isoDate(now), seed: now.getTime() % 100000, weekday: now.getDay(), bed: 23 * 60 + Math.round(Math.random() * 40), voiceTarget: clamp(Math.round(30 + s.eq.mid * 0.45 + (s.adaptive ? 6 : 0)), 40, 90), wakeProb: clamp(0.5 - (s.eq.mid - 55) / 90 - (s.adaptive ? 0.08 : 0), 0.05, 0.6) });

    setUiState((prev) => ({ ...prev, session: null, phase: null, tab: 'sleep', nightIdx: null }));
    setToast({ msg: 'Your night report is ready', icon: 'check', k: Date.now() });
  }, [s.eq.mid, s.adaptive, set]);

  const reset = useCallback(() => {
    lsDel(LS_KEY); revealed.clear();
    setS({ ...DEFAULT_STATE, chat: [], sessions: [] });
    setUiState({ tab: 'tonight', profile: false, sheet: null, sheetProps: null, session: null, phase: null, highlight: false, nightIdx: null });
  }, []);

  const value = { s, set, ui, setUi, toast, toastMsg, go, openSheet, closeSheet, nights, applyProfile, setEqManual, applyRec, endSession, reset };
  return <AppCtx.Provider value={value}>{children}</AppCtx.Provider>;
}

/* --------------------------- AI text reveal --------------------------- */
function AIText({ id, text, className = 'body', delay = 650, shimmer = true, onTick, style }) {
  const [n, setN] = useState(() => (revealed.has(id) ? text.length : -1));
  useEffect(() => {
    if (revealed.has(id)) { setN(text.length); return undefined; }
    setN(shimmer ? -1 : 0);
    let i = 0, iv = null;
    const to = setTimeout(() => {
      iv = setInterval(() => {
        i = Math.min(text.length, i + 3);
        setN(i);
        if (onTick) onTick();
        if (i >= text.length) { clearInterval(iv); revealed.add(id); }
      }, 22);
    }, shimmer ? delay : 0);
    return () => { clearTimeout(to); if (iv) clearInterval(iv); };
  }, [id, text]);
  if (n < 0) return <div className="shimmer-lines" aria-label="Shhh AI is analysing" style={style}><i style={{ width: '94%' }} /><i style={{ width: '80%' }} /><i style={{ width: '52%' }} /></div>;
  return <p className={className} style={style} aria-live="polite">{text.slice(0, n)}{n < text.length && <span className="caret" />}</p>;
}

function useLoading(ms, dep) {
  const [l, setL] = useState(true);
  useEffect(() => { setL(true); const t = setTimeout(() => setL(false), ms); return () => clearTimeout(t); }, [dep]);
  return l;
}
const Skel = ({ h = 150, r = 16 }) => <div className="skel" style={{ height: h, borderRadius: r }} aria-hidden="true"><span /></div>;
function useCount(target, ms = 1100, dep) {
  const [v, setV] = useState(0);
  useEffect(() => {
    let raf, t0 = null;
    const step = (t) => { if (t0 == null) t0 = t; const p = clamp((t - t0) / ms, 0, 1); setV(Math.round(target * (1 - Math.pow(1 - p, 3)))); if (p < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, dep]);
  return v;
}

/* ------------------------------ charts ------------------------------ */
function Gauge({ value, size = 128 }) {
  const r = 54, c = 2 * Math.PI * r;
  const [p, setP] = useState(0);
  useEffect(() => { setP(0); const t = setTimeout(() => setP(value), 80); return () => clearTimeout(t); }, [value]);
  const shown = useCount(value, 1200, value);
  return (
    <div style={{ position: 'relative', width: size, height: size, flex: 'none' }} role="img" aria-label={`Sleep score ${value} out of 100`}>
      <svg width={size} height={size} viewBox="0 0 128 128" style={{ transform: 'rotate(-90deg)' }}>
        <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#C4BCFF" /><stop offset="1" stopColor="#7566D6" /></linearGradient></defs>
        <circle cx="64" cy="64" r={r} fill="none" stroke="rgba(255,255,255,.07)" strokeWidth="10" />
        <circle cx="64" cy="64" r={r} fill="none" stroke="url(#gg)" strokeWidth="10" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c * (1 - p / 100)} style={{ transition: 'stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)', filter: 'drop-shadow(0 0 8px rgba(139,127,224,.6))' }} />
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
        <div className="num" style={{ fontSize: 38, fontWeight: 800, letterSpacing: '-.04em', color: 'var(--title)', lineHeight: 1 }}>{shown}</div>
        <div className="mute" style={{ marginTop: 3 }}>/ 100</div>
      </div>
    </div>
  );
}

function Sparkle({ x, y, s = 1, fill = '#EDEBF5' }) {

}

function Hypnogram({ night, selected, onSelect }) {
  const W = 326, H = 178, pl = 40, pr = 4, pt = 14, pb = 24, rh = (H - pt - pb) / 4;
  const x = (t) => pl + (t / night.total) * (W - pl - pr), y = (st) => pt + st * rh;
  const ticks = [];
  for (let m = Math.ceil((night.bed + 30) / 120) * 120; m < night.bed + night.total - 25; m += 120) ticks.push(m);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label="Sleep stages across the night" style={{ display: 'block', overflow: 'visible' }}>
      <defs><clipPath id="hypc"><rect x="0" y="0" width={W} height={H} className="clip-reveal" /></clipPath></defs>
      {[0, 1, 2, 3].map((st) => (
        <g key={st}>
          <line x1={pl} x2={W - pr} y1={y(st) + rh / 2} y2={y(st) + rh / 2} stroke="rgba(255,255,255,.05)" strokeDasharray="2 4" />
          <text x="0" y={y(st) + rh / 2 + 3.500} className="ax">{STAGE[st].n}</text>
        </g>
      ))}
      {ticks.map((m) => <text key={m} x={x(m - night.bed)} y={H - 6} textAnchor="middle" className="ax">{fmtClock(m)}</text>)}
      <g clipPath="url(#hypc)">
        {night.segs.map((g, i) => {
          const nx = night.segs[i + 1];
          return nx ? <line key={'c' + i} x1={x(g.e)} x2={x(g.e)} y1={y(g.st) + rh / 2} y2={y(nx.st) + rh / 2} stroke="rgba(255,255,255,.14)" strokeWidth="1" /> : null;
        })}
        {night.segs.map((g, i) => <rect key={i} x={x(g.s)} y={y(g.st) + rh * 0.2} width={Math.max(2.500, x(g.e) - x(g.s) - 0.800)} height={rh * 0.6} rx="4" fill={STAGE[g.st].c} opacity={g.st === 0 ? 0.95 : 0.92} />)}
      </g>
      <g className="fade-d">
        {night.markers.map((m, i) => {
          const cx = x(m.t), cy = y(stageAt(night.segs, m.t)) + rh * 0.2 - 6, on = selected === i;
          return (
            <g key={i} className="mk" role="button" tabIndex={0} aria-label={`${m.title}, tap for details`} onClick={() => onSelect(on ? null : i)} onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onSelect(on ? null : i); } }}>
              <circle cx={cx} cy={cy} r="20" fill="transparent" />
              <circle cx={cx} cy={cy} r={on ? 13 : 11} fill="rgba(139,127,224,.25)" className="halo" />
              <circle cx={cx} cy={cy} r="8.500" fill="#0E1330" stroke={on ? '#fff' : '#A89EF0'} strokeWidth="1.500" />
              <Sparkle x={cx} y={cy} s={0.85} />
            </g>
          );
        })}
      </g>
    </svg>
  );
}

function TrendChart({ data, selected, onSelect }) {
  const W = 326, H = 168, pl = 26, pt = 22, pb = 22, n = data.length, bw = (W - pl) / n, barW = Math.min(28, bw * 0.62);
  const y = (v) => pt + (H - pt - pb) * (1 - (v - 50) / 50);
  const sel = selected == null ? n - 1 : selected;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label="Sleep score trend" style={{ display: 'block', overflow: 'visible' }}>
      <defs>
        <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#B3A9FA" /><stop offset="1" stopColor="#6558C9" /></linearGradient>
        <linearGradient id="barL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#8B7FE0" stopOpacity=".45" /><stop offset="1" stopColor="#8B7FE0" stopOpacity=".18" /></linearGradient>
      </defs>
      {[60, 80, 100].map((v) => <g key={v}><line x1={pl} x2={W} y1={y(v)} y2={y(v)} stroke="rgba(255,255,255,.06)" strokeDasharray="2 4" /><text x="0" y={y(v) + 3.500} className="ax">{v}</text></g>)}
      {data.map((d, i) => {
        const cx = pl + bw * i + bw / 2, top = y(d.score), on = i === sel;
        return (
          <g key={d.id} style={{ cursor: 'pointer' }} role="button" tabIndex={0} aria-label={`${d.full}: score ${d.score}`} onClick={() => onSelect(i)} onKeyDown={(e) => { if (e.key === 'Enter') onSelect(i); }}>
            <rect x={cx - bw / 2} y={pt - 10} width={bw} height={H - pt - pb + 10} fill="transparent" />
            <rect className="bar-grow" style={{ animationDelay: i * (n > 10 ? 14 : 45) + 'ms' }} x={cx - barW / 2} y={top} width={barW} height={H - pb - top} rx={Math.min(6, barW / 2.500)} fill={d.legacy ? 'url(#barL)' : 'url(#bar)'} opacity={on ? 1 : 0.78} stroke={on ? '#EDEBF5' : 'none'} strokeWidth="1" />
            {(n <= 7 || i % 5 === 0 || i === n - 1) && <text x={cx} y={H - 6} textAnchor="middle" className="ax">{d.label}</text>}
          </g>
        );
      })}
      {(() => { const d = data[sel], cx = pl + bw * sel + bw / 2, top = y(d.score); return <g className="fade-d"><rect x={cx - 17} y={top - 22} width="34" height="17" rx="8.500" fill="#EDEBF5" /><text x={cx} y={top - 10} textAnchor="middle" fontSize="11" fontWeight="700" fill="#0A0E1F">{d.score}</text></g>; })()}
    </svg>
  );
}

function NoiseTimeline({ night, selected, onSelect }) {
  const W = 326, H = 178, pl = 30, pr = 4, pt = 10, pb = 24;
  const x = (t) => pl + (t / night.total) * (W - pl - pr), y = (db) => pt + (H - pt - pb) * (1 - (db - 25) / 60);
  const line = (arr) => arr.map((v, i) => `${i ? 'L' : 'M'}${x(i * 5).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const ticks = [];
  for (let m = Math.ceil((night.bed + 30) / 120) * 120; m < night.bed + night.total - 25; m += 120) ticks.push(m);
  const pathA = line(night.amb);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label="Ambient noise level over the night" style={{ display: 'block', overflow: 'visible' }}>
      <defs>
        <linearGradient id="ambf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#9C99AE" stopOpacity=".28" /><stop offset="1" stopColor="#9C99AE" stopOpacity="0" /></linearGradient>
        <clipPath id="ntc"><rect x="0" y="0" width={W} height={H} className="clip-reveal" /></clipPath>
      </defs>
      {[30, 50, 70].map((v) => <g key={v}><line x1={pl} x2={W - pr} y1={y(v)} y2={y(v)} stroke="rgba(255,255,255,.06)" strokeDasharray="2 4" /><text x="0" y={y(v) + 3.500} className="ax">{v} dB</text></g>)}
      {ticks.map((m) => <text key={m} x={x(m - night.bed)} y={H - 6} textAnchor="middle" className="ax">{fmtClock(m)}</text>)}
      <g clipPath="url(#ntc)">
        <path d={`${pathA} L${x(night.total)} ${y(25)} L${x(0)} ${y(25)}Z`} fill="url(#ambf)" />
        <path d={pathA} fill="none" stroke="#8E8AA6" strokeWidth="1.500" strokeLinejoin="round" />
        <path d={line(night.heard)} fill="none" stroke="#A89EF0" strokeWidth="2.200" strokeLinejoin="round" style={{ filter: 'drop-shadow(0 0 5px rgba(139,127,224,.7))' }} />
      </g>
      <g className="fade-d">
        {night.events.filter((e) => e.db >= 67 || e.woke).map((e) => {
          const i = night.events.indexOf(e), idx = clamp(Math.round(e.t / 5), 0, night.amb.length - 1), on = selected === i, ok = e.pct >= 80;
          return (
            <g key={i} className="mk" role="button" tabIndex={0} aria-label={`${e.label} at ${fmtClock(night.bed + e.t)}`} onClick={() => onSelect(on ? null : i)} onKeyDown={(k) => { if (k.key === 'Enter') onSelect(on ? null : i); }}>
              <circle cx={x(e.t)} cy={y(night.amb[idx])} r="16" fill="transparent" />
              {on && <circle cx={x(e.t)} cy={y(night.amb[idx])} r="10" fill="none" stroke="#fff" strokeWidth="1.200" opacity=".8" />}
              <circle cx={x(e.t)} cy={y(night.amb[idx])} r="5" fill={ok ? '#A89EF0' : '#8E8AA6'} stroke="#0E1330" strokeWidth="1.500" />
            </g>
          );
        })}
      </g>
    </svg>
  );
}

function HourBars({ buckets, selected, onSelect }) {
  const W = 326, H = 150, pl = 6, pt = 8, pb = 24, n = buckets.length, bw = (W - pl) / n, mx = Math.max(1, ...buckets.map((b) => b.total));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label="Noise events by hour" style={{ display: 'block', overflow: 'visible' }}>
      {buckets.map((b, i) => {
        const cx = pl + bw * i + bw / 2, bwid = bw * 0.62, hh = (H - pt - pb), hc = (b.cancelled / mx) * hh, hp = (b.partly / mx) * hh, on = selected === i;
        return (
          <g key={i} style={{ cursor: 'pointer' }} role="button" tabIndex={0} aria-label={`${b.label}: ${b.total} events`} onClick={() => onSelect(on ? null : i)} onKeyDown={(e) => { if (e.key === 'Enter') onSelect(on ? null : i); }}>
            <rect x={cx - bw / 2} y={pt} width={bw} height={hh} fill={on ? 'rgba(139,127,224,.1)' : 'transparent'} rx="8" />
            <rect className="bar-grow" style={{ animationDelay: i * 50 + 'ms' }} x={cx - bwid / 2} y={pt + hh - hc} width={bwid} height={Math.max(0, hc)} rx="4" fill="#A89EF0" />
            <rect className="bar-grow" style={{ animationDelay: i * 50 + 'ms' }} x={cx - bwid / 2} y={pt + hh - hc - hp} width={bwid} height={Math.max(0, hp)} rx="4" fill="#8E8AA6" />
            <text x={cx} y={H - 6} textAnchor="middle" className="ax">{b.short}</text>
          </g>
        );
      })}
    </svg>
  );
}

function VSlider({ value, onChange, label, disabled }) {
  const rail = useRef(null), drag = useRef(false);
  const upd = (e) => { const r = rail.current.getBoundingClientRect(); onChange(clamp(Math.round(((r.bottom - e.clientY) / r.height) * 100), 0, 100)); };
  return (
    <div className={'vs' + (disabled ? ' dis' : '')} role="slider" tabIndex={disabled ? -1 : 0} aria-label={label} aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(value)} aria-orientation="vertical"
      onPointerDown={(e) => { if (disabled) return; drag.current = true; e.currentTarget.setPointerCapture(e.pointerId); upd(e); }}
      onPointerMove={(e) => { if (drag.current) upd(e); }}
      onPointerUp={() => { drag.current = false; }} onPointerCancel={() => { drag.current = false; }}
      onKeyDown={(e) => { if (disabled) return; if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); onChange(clamp(value + 5, 0, 100)); } if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); onChange(clamp(value - 5, 0, 100)); } }}>
      <div className="vs-rail" ref={rail}><div className="vs-fill" style={{ height: value + '%' }} /></div>
      <div className="vs-thumb" style={{ bottom: value * 1.5 }} />
    </div>
  );
}

function EqPreview({ eq }) {
  const ref = useRef(null), a = useRef(null), b = useRef(null), eqRef = useRef(eq);
  eqRef.current = eq;
  useEffect(() => {
    let raf;
    const W = 300, H = 60, mid = H / 2;
    const loop = (t) => {
      const e = eqRef.current, ts = t / 1000;
      let da = '', db = '';
      for (let i = 0; i <= 100; i++) {
        const px = (i / 100) * W, p = i / 100 * Math.PI * 2;
        const lo = Math.sin(p * 2 - ts * 2), mi = Math.sin(p * 6 - ts * 4.500) * 0.7, hi = Math.sin(p * 17 - ts * 9) * 0.4;
        const raw = (lo + mi + hi) * 9, res = (lo * (1 - e.low / 100 * 0.96) + mi * (1 - e.mid / 100 * 0.96) + hi * (1 - e.high / 100 * 0.96)) * 9;
        da += `${i ? 'L' : 'M'}${px.toFixed(1)} ${(mid + raw).toFixed(1)}`;
        db += `${i ? 'L' : 'M'}${px.toFixed(1)} ${(mid + res).toFixed(1)}`;
      }
      if (a.current) a.current.setAttribute('d', da);
      if (b.current) b.current.setAttribute('d', db);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);
  return (
    <svg ref={ref} viewBox="0 0 300 60" width="100%" height="60" role="img" aria-label="Live preview of noise before and after cancellation" preserveAspectRatio="none" style={{ display: 'block' }}>
      <path ref={a} fill="none" stroke="#6F6D88" strokeWidth="1.200" opacity=".8" />
      <path ref={b} fill="none" stroke="#A89EF0" strokeWidth="2" style={{ filter: 'drop-shadow(0 0 4px rgba(139,127,224,.8))' }} />
    </svg>
  );
}

function StageBars({ night }) {
  const rows = [['Deep', night.deep, 3], ['Light', night.light, 2], ['REM', night.rem, 1], ['Awake', night.awake, 0]];
  const total = night.deep + night.light + night.rem + night.awake;
  const [go, setGo] = useState(false);
  useEffect(() => { setGo(false); const t = setTimeout(() => setGo(true), 120); return () => clearTimeout(t); }, [night.id]);
  return (
    <div className="stack" style={{ gap: 14 }}>
      {rows.map(([name, m, st]) => (
        <div key={name}>
          <div className="row between" style={{ marginBottom: 7 }}>
            <span className="row gap2 title-c" style={{ fontSize: 14, fontWeight: 600 }}><i style={{ width: 10, height: 10, borderRadius: 4, background: STAGE[st].c, display: 'inline-block' }} />{name}</span>
            <span className="num title-c" style={{ fontSize: 14, fontWeight: 600 }}>{fmtDur(m)} <span className="mute" style={{ marginLeft: 4 }}>{Math.round((m / total) * 100)}%</span></span>
          </div>
          <div className="meter"><i style={{ width: go ? (m / total) * 100 + '%' : '0%', background: STAGE[st].c }} /></div>
        </div>
      ))}
    </div>
  );
}

const DETECT = [
  { k: 'traffic', l: 'Bus', r: 'cancelled' }, { k: 'traffic', l: 'Car horn', r: 'cancelled' }, { k: 'voices', l: 'Voices', r: 'reduced' },
  { k: 'bass', l: 'Bass music', r: 'cancelled' }, { k: 'traffic', l: 'Motorbike', r: 'cancelled' }, { k: 'truck', l: 'Garbage truck', r: 'cancelled' },
  { k: 'voices', l: 'Street chatter', r: 'reduced' }, { k: 'traffic', l: 'Tram', r: 'cancelled' }
];
function LiveWave({ boost }) {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current; if (!cv) return undefined;
    const ctx = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2), W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
    let raf, e = 0;
    const loop = (t) => {
      const ts = t / 1000; e += (boost.current - e) * 0.06; boost.current *= 0.985;
      ctx.clearRect(0, 0, W, H);
      const mid = H / 2, amp = 12 + e * 22;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 2) {
        const p = x / W * Math.PI * 2;
        const y = mid + (Math.sin(p * 3 - ts * 2.2) * 0.6 + Math.sin(p * 9 - ts * 4.300) * 0.45 + Math.sin(p * 23 - ts * 7.100) * 0.28 + Math.sin(p * 41 + ts * 5) * 0.12) * amp;
        x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.strokeStyle = 'rgba(156,153,174,.5)'; ctx.lineWidth = 1.500; ctx.stroke();
      ctx.beginPath();
      for (let x = 0; x <= W; x += 3) { const y = mid + Math.sin(x / W * Math.PI * 6 - ts * 1.500) * (0.7 + e * 0.5); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.shadowColor = 'rgba(139,127,224,.9)'; ctx.shadowBlur = 12; ctx.strokeStyle = '#A89EF0'; ctx.lineWidth = 2.400; ctx.stroke(); ctx.shadowBlur = 0;
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);
  return <canvas ref={ref} style={{ width: '100%', height: 120, display: 'block' }} role="img" aria-label="Live noise wave being flattened by Shhh" />;
}

function SleepMode() {

const SUGGESTIONS = ['Why did I wake up last night?', 'How can I get more deep sleep?', 'Which noise bothers me most?', 'Adjust my earplugs for this weekend'];
function Msg({ m, onAction, scroll }) {
  const fresh = useRef(!revealed.has(m.id)).current;
  const delay = fresh ? m.text.length * 7.500 + 250 : 0;
  if (m.role === 'user') return <div className="bubble me">{m.text}</div>;
  return (
    <div className="stack" style={{ gap: 8, alignItems: 'flex-start' }}>
      <div className="bubble ai"><AIText id={m.id} text={m.text} shimmer={false} className="" onTick={scroll} /></div>
      {m.chip && <span className="pill lav" style={{ minHeight: 32, padding: '0 14px', fontSize: 13, animation: `rise .5s ${delay}ms both` }}><Icon name="check" size={14} stroke={2.600} />{m.chip}</span>}
      {m.actions && <div className="row gap2" style={{ flexWrap: 'wrap', animation: `rise .5s ${delay}ms both` }}>{m.actions.map((a) => <button key={a.label} type="button" className="chip chip-ai" onClick={() => onAction(a)}><Icon name="sparkle" size={14} fill="currentColor" stroke={0.5} />{a.label}</button>)}</div>}
    </div>
  );
}

function CoachTab() {
  const { s, set, nights, go, applyProfile, toast } = useApp();
  const last = nights[nights.length - 1], name = s.name.trim() || 'there';
  const adaptive = useMemo(() => nights.filter((x) => !x.legacy), [nights]);
  const top = useMemo(() => aggregate(adaptive), [adaptive]);
  const [input, setInput] = useState(''), [busy, setBusy] = useState(false);
  const box = useRef(null);
  const scroll = useCallback(() => { const b = box.current; if (b) b.scrollTop = b.scrollHeight; }, []);
  useEffect(() => { scroll(); }, [s.chat.length, busy]);
  const recent = nights.slice(-7);
  const ctx = { name, last, top, nights: adaptive.length, sources: s.sources, alarm: s.alarm, goal: s.goal, avgDeep: mean(adaptive.map((x) => x.deep)), avg7: mean(recent.map((x) => x.asleep)), avgLat: mean(recent.map((x) => x.latency)), voiceWeekend: adaptive.flatMap((x) => x.events).filter((e) => e.cat === 'voices' && e.t >= 60 && e.t <= 220).length };
  const opening = `Hi ${name}. Last night you slept ${fmtDur(last.asleep)} with a score of ${last.score}. Want to know what woke you up, or how to fall asleep faster?`;
  const send = (text) => {
    const t = text.trim();
    if (!t || busy) return;
    const um = { id: 'u' + Date.now(), role: 'user', text: t };
    revealed.add(um.id);
    set((p) => ({ chat: [...p.chat, um] }));
    setInput(''); setBusy(true);
    setTimeout(() => {
      const r = coachReply(t, ctx);
      if (r.apply) applyProfile(r.apply);
      set((p) => ({ chat: [...p.chat, { id: 'a' + Date.now(), role: 'ai', text: r.text, chip: r.chip, actions: r.actions }] }));
      setBusy(false);
    }, 950 + Math.random() * 600);
  };
  const act = (a) => {
    if (a.do === 'rec') { if (s.recDismissed) set({ recDismissed: false }); go('earplugs', { highlight: true }); }
    else if (a.do === 'noise') go('noise');
    else if (a.do.startsWith('profile:')) {
      const id = a.do.split(':')[1], p = PROFILES.find((x) => x.id === id);
      applyProfile(id); toast(`${p.name} applied — synced to your earplugs`);
      set((q) => ({ chat: [...q.chat, { id: 'a' + Date.now(), role: 'ai', text: `Done. I'll compare tonight's results with your previous nights and tell you if it helps.`, chip: `${p.name} profile applied ✓` }] }));
    }
  };
  return (
    <div className="screen screen-enter" style={{ padding: 0, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <div className="row between" style={{ padding: 'calc(var(--sat) + 14px) 20px 14px', borderBottom: '1px solid var(--line)', background: 'rgba(10,14,31,.6)' }}>
        <div className="row gap3">
          <div className="orb" style={{ width: 42, height: 42 }} aria-hidden="true"><Icon name="sparkle" size={18} fill="currentColor" stroke={0.5} /></div>
          <div><div className="h3">Shhh AI · Sleep coach</div><div className="row gap2" style={{ marginTop: 3 }}><AIBadge /><span className="mute">Knows your last {adaptive.length} nights</span></div></div>
        </div>
        {s.chat.length > 0 && <button type="button" className="iconbtn" aria-label="Clear conversation" onClick={() => { set({ chat: [] }); toast('Conversation cleared', 'trash'); }}><Icon name="trash" size={18} /></button>}
      </div>
      <div ref={box} className="stack" style={{ flex: 1, overflowY: 'auto', padding: '18px 20px', gap: 14, scrollbarWidth: 'none' }}>
        <Msg key={'open' + last.id} m={{ id: 'open-' + last.id + name, role: 'ai', text: opening }} onAction={act} scroll={scroll} />
        {s.chat.map((m) => <Msg key={m.id} m={m} onAction={act} scroll={scroll} />)}
        {busy && <div className="bubble ai" style={{ alignSelf: 'flex-start' }} aria-label="Shhh AI is typing"><span className="typing"><i /><i /><i /></span></div>}
      </div>
      <div style={{ padding: '10px 20px calc(var(--tab) + var(--sab) + 6px)', borderTop: '1px solid var(--line)', background: 'rgba(10,14,31,.85)' }}>
        <div className="hscroll" style={{ marginBottom: 10 }}>{SUGGESTIONS.map((q) => <button key={q} type="button" className="chip" disabled={busy} style={{ opacity: busy ? 0.5 : 1 }} onClick={() => send(q)}>{q}</button>)}</div>
        <form className="row gap2" onSubmit={(e) => { e.preventDefault(); send(input); }}>
          <input className="field" style={{ borderRadius: 24, flex: 1 }} value={input} onChange={(e) => setInput(e.target.value)} placeholder="Ask Shhh AI about your sleep" aria-label="Message to Shhh AI" maxLength={200} />
          <button type="submit" className="iconbtn" aria-label="Send message" disabled={!input.trim() || busy} style={{ background: input.trim() && !busy ? 'var(--accent)' : undefined, opacity: input.trim() && !busy ? 1 : 0.5, width: 48, height: 48 }}><Icon name="send" size={19} /></button>
        </form>
        <p className="mute" style={{ textAlign: 'center', marginTop: 8, fontSize: 11 }}>Shhh AI gives wellness tips, not medical advice.</p>
      </div>
    </div>
  );
}

      <SheetHost />
      <ToastHost />
      {splash && <Splash onDone={() => setSplash(false)} />}
    </>
  );
}

const STAR_SHADOWS = (() => {
  const r = rng(7);
  return Array.from({ length: 110 }, () => `${(r() * 100).toFixed(1)}vw ${(r() * 100).toFixed(1)}vh 0 ${r() < 0.2 ? 1 : 0}px rgba(237,235,245,${(0.2 + r() * 0.6).toFixed(2)})`).join(',');
})();

function useViewport() {
  const [v, setV] = useState({ w: window.innerWidth, h: window.innerHeight });
  useEffect(() => { const f = () => setV({ w: window.innerWidth, h: window.innerHeight }); window.addEventListener('resize', f); return () => window.removeEventListener('resize', f); }, []);
  return v;
}

function Stage() {
  const { w, h } = useViewport();
  const desktop = w >= 600 && h >= 520;
  if (!desktop) return <div className="app"><Screens /></div>;
  const sc = Math.min(1, (h - 76) / 868, (w - 24) / 414);
  return (
    <div className="stage">
      <div className="glow" />
      <div className="stars" style={{ boxShadow: STAR_SHADOWS }} aria-hidden="true" />
      <div className="phone-box" style={{ width: 414 * sc, height: 868 * sc }}>
        <div className="phone-scale" style={{ transform: `scale(${sc})` }}>
          <div className="bezel">
            <span className="btn-side" style={{ left: -4, top: 150, height: 30 }} /><span className="btn-side" style={{ left: -4, top: 210, height: 58 }} /><span className="btn-side" style={{ left: -4, top: 280, height: 58 }} /><span className="btn-side" style={{ right: -4, top: 230, height: 90 }} />
            <div className="app framed"><Screens /><StatusBar /></div>
          </div>
        </div>
      </div>
      <p className="stage-cap">Shhh companion app — V1</p>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: false }; }
  static getDerivedStateFromError() { return { err: true }; }
  render() {
    if (!this.state.err) return this.props.children;
    return (
      <div style={{ position: 'fixed', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 14, padding: 30, textAlign: 'center', background: '#0A0E1F' }}>
        <Logo size={40} /><p className="body">Something went wrong. Your data is safe.</p>
        <button type="button" className="btn btn-primary" onClick={() => window.location.reload()}>Reload Shhh</button>
      </div>
    );
  }
}

/* PWA polish: PNG touch icon + manifest with an absolute start_url, built at runtime */
(function enhanceInstall() {
  try {
    const iconLink = document.querySelector('link[rel="icon"]'), apple = document.querySelector('link[rel="apple-touch-icon"]'), man = document.querySelector('link[rel="manifest"]');
    const img = new Image();
    img.onload = () => {
      try {
        const png = (size) => { const c = document.createElement('canvas'); c.width = c.height = size; c.getContext('2d').drawImage(img, 0, 0, size, size); return c.toDataURL('image/png'); };
        apple.setAttribute('href', png(180));
        const m = JSON.parse(decodeURIComponent(man.getAttribute('href').split(',').slice(1).join(',')));
        if (/^https?:/.test(window.location.href)) m.start_url = window.location.href.split('#')[0];
        m.icons = [{ src: png(192), sizes: '192x192', type: 'image/png', purpose: 'any' }, { src: png(512), sizes: '512x512', type: 'image/png', purpose: 'any' }, ...m.icons];
        man.setAttribute('href', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(m)));
      } catch (e) { /* keep static versions */ }
    };
    img.src = iconLink.getAttribute('href');
  } catch (e) { /* install polish is optional */ }
})();

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><Provider><Stage /></Provider></ErrorBoundary>);
</script>
